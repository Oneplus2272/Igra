<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Битва за трон</title>
    <!-- Подключаем официальный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden; /* Убираем прокрутку */
            color: white;
            /* Отключаем выделение текста, чтобы игра ощущалась как приложение */
            user-select: none; 
            -webkit-user-select: none;
        }

        /* --- ЗАГРУЗОЧНЫЙ ЭКРАН --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('bj.jpg'); 
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-out;
        }

        #splash-screen::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .game-title {
            font-family: 'Georgia', serif;
            font-size: 42px;
            font-weight: bold;
            color: #FFD700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #FF8C00, 0 0 20px #FF4500, 0 0 30px #FF4500;
            margin-bottom: 50px;
            animation: fadeInDown 2s ease-out;
        }

        .progress-container {
            width: 80%;
            max-width: 350px;
            height: 30px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid #FFD700;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 12px;
            transition: width 0.1s linear;
        }

        .progress-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 16px;
            color: #fff;
            text-shadow: 1px 1px 3px #000;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- СТИЛИ ИГРЫ (АРЕНА) --- */
        #game-container { 
            display: none; 
            padding: 20px; 
            text-align: center;
            height: 100vh;
            box-sizing: border-box;
            background-color: #1a1a2e; /* Фон для арены */
        }
        .card {
            background-color: #16213e;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .hp-bar { background-color: #444; height: 20px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .hp-fill { background-color: #e94560; height: 100%; width: 100%; transition: width 0.3s; }
        button { 
            background-color: #0f3460; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 18px; 
            border-radius: 10px; 
            margin: 5px; 
            cursor: pointer; 
        }
        button:active { background-color: #e94560; }
        .log { font-size: 14px; color: #aaa; height: 60px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- ЗАГРУЗОЧНЫЙ ЭКРАН -->
    <div id="splash-screen">
        <div class="game-title">Битва за трон</div>
        
        <div class="progress-container">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-text" id="progress-text">0%</div>
        </div>
    </div>

    <!-- ИГРА (Скрыта изначально) -->
    <div id="game-container">
        <h2>Бой начался!</h2>
        <div class="card">
            <h3>👹 Враг: Гоблин</h3>
            <div class="hp-bar"><div class="hp-fill" id="enemy-hp-bar"></div></div>
            <p>HP: <span id="enemy-hp-text">50</span> / 50</p>
        </div>

        <div class="log" id="log">Ты готов к бою...</div>

        <div class="card">
            <h3>🛡️ Твой Воин</h3>
            <div class="hp-bar"><div class="hp-fill" id="player-hp-bar" style="background-color: #4e9f3d;"></div></div>
            <p>HP: <span id="player-hp-text">100</span> / 100</p>
        </div>

        <button onclick="attack()">Атаковать!</button>
        <button onclick="location.reload()">Заново</button>
    </div>

    <script>
        // --- МАГИЯ ПОЛНОЭКРАННОГО РЕЖИМА TELEGRAM ---
        // Ждем, пока Telegram загрузится
        window.onload = () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                
                // Говорим Telegram, что игра готова
                tg.ready(); 
                
                // Разворачиваем на максимум (Fullsize)
                tg.expand();
                
                // Пытаемся включить НАСТОЯЩИЙ полный экран (скрывает панели)
                try {
                    if (tg.requestFullscreen) {
                        tg.requestFullscreen();
                    }
                } catch (e) {
                    console.log("Полный экран не поддерживается:", e);
                }

                // Включаем блокировку свайпа вниз (чтобы случайно не закрыть игру)
                if (tg.enableClosingConfirmation) {
                    tg.enableClosingConfirmation();
                }
            }
            
            // Запускаем загрузку игры
            startLoading();
        };

        // --- ЛОГИКА ЗАГРУЗКИ ---
        let progress = 0;
        const fill = document.getElementById('progress-fill');
        const text = document.getElementById('progress-text');
        const splash = document.getElementById('splash-screen');
        const game = document.getElementById('game-container');

        function startLoading() {
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 5) + 1;
                
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    
                    setTimeout(() => {
                        splash.style.opacity = '0';
                        setTimeout(() => {
                            splash.style.display = 'none';
                            game.style.display = 'block';
                        }, 1000);
                    }, 500);
                }

                fill.style.width = progress + '%';
                text.innerText = progress + '%';
            }, 50);
        }

        // --- ЛОГИКА БОЯ ---
        let enemyHp = 50;
        let playerHp = 100;
        let isGameOver = false;

        const enemyHpBar = document.getElementById('enemy-hp-bar');
        const enemyHpText = document.getElementById('enemy-hp-text');
        const playerHpBar = document.getElementById('player-hp-bar');
        const playerHpText = document.getElementById('player-hp-text');
        const log = document.getElementById('log');

        function updateUI() {
            enemyHpBar.style.width = Math.max(0, (enemyHp / 50) * 100) + '%';
            enemyHpText.innerText = Math.max(0, enemyHp);
            playerHpBar.style.width = Math.max(0, (playerHp / 100) * 100) + '%';
            playerHpText.innerText = Math.max(0, playerHp);
        }

        function attack() {
            if (isGameOver) return;
            let playerDamage = Math.floor(Math.random() * 6) + 10;
            enemyHp -= playerDamage;
            log.innerText = `Ты нанёс ${playerDamage} урона!`;
            updateUI();

            if (enemyHp <= 0) {
                log.innerText += " 👑 Враг повержен!";
                isGameOver = true;
                return;
            }

            setTimeout(() => {
                if (isGameOver) return;
                let enemyDamage = Math.floor(Math.random() * 5) + 5;
                playerHp -= enemyDamage;
                log.innerText += ` | Враг нанёс ${enemyDamage} урона!`;
                updateUI();

                if (playerHp <= 0) {
                    log.innerText += " 💀 Ты проиграл...";
                    isGameOver = true;
                }
            }, 500);
        }
    </script>
</body>
</html>
