<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Битва за трон</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- ЗАГРУЗКА --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('bj.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 1s ease-out;
        }
        #splash-screen::before {
            content: ""; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: -1;
        }
        .game-title {
            font-family: 'Georgia', serif; font-size: 42px; font-weight: bold;
            color: #FFD700; text-align: center; text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #FF8C00, 0 0 20px #FF4500, 0 0 30px #FF4500;
            margin-bottom: 50px; animation: fadeInDown 2s ease-out;
        }
        .progress-container {
            width: 80%; max-width: 350px; height: 30px;
            background-color: rgba(255,255,255,0.2);
            border: 2px solid #FFD700; border-radius: 15px;
            position: relative; overflow: hidden;
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 12px; transition: width 0.1s linear;
        }
        .progress-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold; font-size: 16px;
            color: #fff; text-shadow: 1px 1px 3px #000;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- БОЙ --- */
        #game-container {
            display: none; padding: 20px; text-align: center;
            height: 100vh; box-sizing: border-box;
            background-color: #1a1a2e; overflow-y: auto;
        }
        .card {
            background-color: #16213e; border-radius: 15px;
            padding: 15px; margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .hp-bar { background-color: #444; height: 20px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .hp-fill { background-color: #e94560; height: 100%; width: 100%; transition: width 0.3s; }
        button {
            background-color: #0f3460; color: white; border: none;
            padding: 15px 30px; font-size: 18px; border-radius: 10px;
            margin: 5px; cursor: pointer;
        }
        button:active { background-color: #e94560; }
        .log { font-size: 14px; color: #aaa; height: 60px; margin-top: 10px; }

        /* --- КАРТА --- */
        #map-screen {
            display: none; position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #0d1b2a; z-index: 100; overflow: hidden;
        }
        #map-toolbar {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 10px; box-sizing: border-box;
            background: rgba(0,0,0,0.7);
            display: flex; justify-content: space-between;
            align-items: center; z-index: 10;
        }
        #map-toolbar h3 { margin: 0; color: #FFD700; font-size: 18px; }
        #map-toolbar button { padding: 8px 14px; font-size: 14px; margin: 0; }

        #map-scroll {
            position: absolute; top: 55px; left: 0;
            width: 100%; height: calc(100vh - 55px);
            overflow: auto; -webkit-overflow-scrolling: touch;
        }

        #map-grid {
            position: relative;
            display: grid;
            grid-template-columns: repeat(25, 40px);
            grid-template-rows: repeat(10, 40px);
            gap: 1px; padding: 10px;
            width: max-content;
            background-image: url('ground.png');
            background-size: cover;
            background-position: center;
        }

        .cell {
            position: relative;
            width: 40px; height: 40px;
            background-color: rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.15);
            box-sizing: border-box;
            cursor: pointer;
            border-radius: 3px;
            transition: background-color 0.15s;
        }
        .cell:active { background-color: rgba(255,255,255,0.2); }

        .building-img {
            position: absolute;
            width: 80px;
            height: 80px;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        /* Меню постройки */
        #build-menu {
            display: none; position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: linear-gradient(180deg, #16213e, #0a0f1e);
            padding: 15px;
            box-sizing: border-box; z-index: 200;
            border-top: 2px solid #FFD700;
            text-align: center;
        }
        #build-menu h4 { margin: 0 0 10px 0; color: #FFD700; }
        .build-option {
            display: inline-block;
            width: 70px; height: 70px;
            margin: 5px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #FFD700;
            border-radius: 10px;
            cursor: pointer;
            padding: 5px;
            box-sizing: border-box;
            vertical-align: top;
        }
        .build-option img {
            width: 100%; height: 70%;
            object-fit: contain;
            pointer-events: none;
        }
        .build-option span {
            font-size: 9px;
            color: #fff;
            display: block;
        }
        #build-menu button {
            padding: 10px 15px; font-size: 15px; margin: 4px;
        }
    </style>
</head>
<body>

    <!-- ЗАГРУЗКА -->
    <div id="splash-screen">
        <div class="game-title">Битва за трон</div>
        <div class="progress-container">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-text" id="progress-text">0%</div>
        </div>
    </div>

    <!-- БОЙ -->
    <div id="game-container">
        <h2>Бой начался!</h2>
        <div class="card">
            <h3>👹 Враг: Гоблин</h3>
            <div class="hp-bar"><div class="hp-fill" id="enemy-hp-bar"></div></div>
            <p>HP: <span id="enemy-hp-text">50</span> / 50</p>
        </div>
        <div class="log" id="log">Ты готов к бою...</div>
        <div class="card">
            <h3>🛡️ Твой Воин</h3>
            <div class="hp-bar"><div class="hp-fill" id="player-hp-bar" style="background-color: #4e9f3d;"></div></div>
            <p>HP: <span id="player-hp-text">100</span> / 100</p>
        </div>
        <button onclick="attack()">Атаковать!</button>
        <button onclick="openMap()">🗺️ На базу</button>
        <button onclick="location.reload()">Заново</button>
    </div>

    <!-- КАРТА -->
    <div id="map-screen">
        <div id="map-toolbar">
            <h3>🏰 Твоя база</h3>
            <button onclick="closeMap()">Закрыть</button>
        </div>
        <div id="map-scroll">
            <div id="map-grid"></div>
        </div>
    </div>

    <!-- МЕНЮ ПОСТРОЙКИ -->
    <div id="build-menu">
        <h4>Выбери здание</h4>
        <div id="build-options"></div>
        <button onclick="closeBuildMenu()">Отмена</button>
    </div>

    <script>
        // --- TELEGRAM ---
        window.onload = () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready(); tg.expand();
                try { if (tg.requestFullscreen) tg.requestFullscreen(); } catch(e) {}
                if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
            }
            startLoading();
            initMap();
        };

        // --- ЗАГРУЗКА ---
        let progress = 0;
        const fill = document.getElementById('progress-fill');
        const text = document.getElementById('progress-text');
        const splash = document.getElementById('splash-screen');
        const game = document.getElementById('game-container');

        function startLoading() {
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 5) + 1;
                if (progress >= 100) {
                    progress = 100; clearInterval(interval);
                    setTimeout(() => {
                        splash.style.opacity = '0';
                        setTimeout(() => {
                            splash.style.display = 'none';
                            game.style.display = 'block';
                        }, 1000);
                    }, 500);
                }
                fill.style.width = progress + '%';
                text.innerText = progress + '%';
            }, 50);
        }

        // --- БОЙ ---
        let enemyHp = 50, playerHp = 100, isGameOver = false;
        const enemyHpBar = document.getElementById('enemy-hp-bar');
        const enemyHpText = document.getElementById('enemy-hp-text');
        const playerHpBar = document.getElementById('player-hp-bar');
        const playerHpText = document.getElementById('player-hp-text');
        const log = document.getElementById('log');

        function updateUI() {
            enemyHpBar.style.width = Math.max(0, (enemyHp/50)*100) + '%';
            enemyHpText.innerText = Math.max(0, enemyHp);
            playerHpBar.style.width = Math.max(0, (playerHp/100)*100) + '%';
            playerHpText.innerText = Math.max(0, playerHp);
        }
        function attack() {
            if (isGameOver) return;
            let playerDamage = Math.floor(Math.random()*6) + 10;
            enemyHp -= playerDamage;
            log.innerText = `Ты нанёс ${playerDamage} урона!`;
            updateUI();
            if (enemyHp <= 0) { log.innerText += " 👑 Враг повержен!"; isGameOver = true; return; }
            setTimeout(() => {
                if (isGameOver) return;
                let enemyDamage = Math.floor(Math.random()*5) + 5;
                playerHp -= enemyDamage;
                log.innerText += ` | Враг нанёс ${enemyDamage} урона!`;
                updateUI();
                if (playerHp <= 0) { log.innerText += " 💀 Ты проиграл..."; isGameOver = true; }
            }, 500);
        }

        // --- КАРТА ---
        const COLS = 25, ROWS = 10;
        const gridEl = document.getElementById('map-grid');
        const mapScreen = document.getElementById('map-screen');
        const buildMenu = document.getElementById('build-menu');
        const buildOptionsEl = document.getElementById('build-options');
        let selectedCell = null;

        // Пути БЕЗ папки — файлы рядом с index.html
        const BUILDINGS = {
            castle:    { name: 'Замок',       img: 'castle.png',     size: 100 },
            barracks:  { name: 'Казарма',     img: 'barracks.png',   size: 80 },
            farm:      { name: 'Ферма',       img: 'farm.png',       size: 80 },
            quarry:    { name: 'Каменоломня', img: 'quarry.png',     size: 80 },
            lumbermill:{ name: 'Лесопилка',   img: 'lumbermill.png', size: 80 }
        };

        let mapData = [];

        function loadMapData() {
            try {
                const saved = localStorage.getItem('baseMap');
                if (saved) {
                    mapData = JSON.parse(saved);
                    if (mapData.length === ROWS) return true;
                }
            } catch(e) {}
            return false;
        }

        function saveMapData() {
            try { localStorage.setItem('baseMap', JSON.stringify(mapData)); } catch(e) {}
        }

        function initMap() {
            gridEl.innerHTML = '';
            mapData = [];

            const hasSaved = loadMapData();

            for (let r = 0; r < ROWS; r++) {
                if (!hasSaved) mapData[r] = [];
                for (let c = 0; c < COLS; c++) {
                    if (!hasSaved) mapData[r][c] = null;
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.addEventListener('click', () => onCellClick(cell, r, c));
                    gridEl.appendChild(cell);
                }
            }

            if (!hasSaved) {
                setBuilding(5, 5, 'castle');
                setBuilding(5, 6, 'barracks');
                setBuilding(6, 5, 'farm');
                setBuilding(4, 5, 'quarry');
                setBuilding(5, 4, 'lumbermill');
                saveMapData();
            } else {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (mapData[r][c]) renderBuilding(r, c, mapData[r][c]);
                    }
                }
            }

            // Меню постройки
            buildOptionsEl.innerHTML = '';
            for (const key in BUILDINGS) {
                const b = BUILDINGS[key];
                const opt = document.createElement('div');
                opt.className = 'build-option';
                opt.innerHTML = `<img src="${b.img}" alt="${b.name}"><span>${b.name}</span>`;
                opt.addEventListener('click', () => placeBuilding(key));
                buildOptionsEl.appendChild(opt);
            }
        }

        function getCell(r, c) {
            return gridEl.children[r * COLS + c];
        }

        function setBuilding(r, c, key) {
            mapData[r][c] = key;
            renderBuilding(r, c, key);
        }

        function renderBuilding(r, c, key) {
            const cell = getCell(r, c);
            if (!cell) return;
            const old = cell.querySelector('.building-img');
            if (old) old.remove();

            const b = BUILDINGS[key];
            const img = document.createElement('img');
            img.src = b.img;
            img.className = 'building-img';
            img.style.width = b.size + 'px';
            img.style.height = b.size + 'px';
            img.style.zIndex = (r * 10) + 1;
            cell.appendChild(img);
        }

        function onCellClick(cell, r, c) {
            if (mapData[r][c]) {
                const b = BUILDINGS[mapData[r][c]];
                alert(`${b.name} на клетке (${c+1}, ${r+1})`);
                return;
            }
            selectedCell = { cell, r, c };
            buildMenu.style.display = 'block';
        }

        function placeBuilding(key) {
            if (!selectedCell) return;
            const { r, c } = selectedCell;
            setBuilding(r, c, key);
            saveMapData();
            closeBuildMenu();
        }

        function closeBuildMenu() {
            buildMenu.style.display = 'none';
            selectedCell = null;
        }

        function openMap() {
            game.style.display = 'none';
            mapScreen.style.display = 'block';
        }
        function closeMap() {
            mapScreen.style.display = 'none';
            game.style.display = 'block';
        }
    </script>
</body>
</html>
