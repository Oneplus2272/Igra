<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Битва за трон</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Отключаем стандартный скролл/зум браузера */
        }

        /* --- ЗАГРУЗКА --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('bj.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 1s ease-out;
        }
        #splash-screen::before {
            content: ""; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: -1;
        }
        .game-title {
            font-family: 'Georgia', serif; font-size: 42px; font-weight: bold;
            color: #FFD700; text-align: center; text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #FF8C00, 0 0 20px #FF4500, 0 0 30px #FF4500;
            margin-bottom: 50px; animation: fadeInDown 2s ease-out;
        }
        .progress-container {
            width: 80%; max-width: 350px; height: 30px;
            background-color: rgba(255,255,255,0.2);
            border: 2px solid #FFD700; border-radius: 15px;
            position: relative; overflow: hidden;
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 12px; transition: width 0.1s linear;
        }
        .progress-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold; font-size: 16px;
            color: #fff; text-shadow: 1px 1px 3px #000;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- БОЙ --- */
        #game-container {
            display: none; padding: 20px; text-align: center;
            height: 100vh; box-sizing: border-box;
            background-color: #1a1a2e; overflow-y: auto;
        }
        .card {
            background-color: #16213e; border-radius: 15px;
            padding: 15px; margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .hp-bar { background-color: #444; height: 20px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .hp-fill { background-color: #e94560; height: 100%; width: 100%; transition: width 0.3s; }
        button {
            background-color: #0f3460; color: white; border: none;
            padding: 15px 30px; font-size: 18px; border-radius: 10px;
            margin: 5px; cursor: pointer;
        }
        button:active { background-color: #e94560; }
        .log { font-size: 14px; color: #aaa; height: 60px; margin-top: 10px; }

        /* --- КАРТА --- */
        #map-screen {
            display: none; position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #0d1b2a; z-index: 100; overflow: hidden;
        }
        #map-toolbar {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 10px; box-sizing: border-box;
            background: rgba(0,0,0,0.7);
            display: flex; justify-content: space-between;
            align-items: center; z-index: 1000;
            pointer-events: none; /* Пропускаем клики сквозь тулбар, кроме кнопки */
        }
        #map-toolbar h3 { margin: 0; color: #FFD700; font-size: 18px; text-shadow: 1px 1px 2px #000; }
        #map-toolbar button { padding: 8px 14px; font-size: 14px; margin: 0; pointer-events: auto; }

        /* Контейнер, в котором двигается карта */
        #map-viewport {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            cursor: grab;
        }
        #map-viewport:active { cursor: grabbing; }

        /* Сама карта, которую мы двигаем */
        #map-world {
            position: absolute;
            top: 0; left: 0;
            width: 2000px; height: 1500px;
            /* Зеленый фон карты */
            background-color: #2a5d34;
            
            /* Рисуем изометрическую сетку через CSS (опционально, для визуала) */
            background-image: 
                linear-gradient(45deg, rgba(0,0,0,0.1) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.1) 75%, rgba(0,0,0,0.1)),
                linear-gradient(45deg, rgba(0,0,0,0.1) 25%, transparent 25%, transparent 75%, rgba(0,0,0,0.1) 75%, rgba(0,0,0,0.1));
            background-size: 80px 80px; /* Размер ромба */
            background-position: 0 0, 40px 40px;
            
            /* Если у тебя есть картинка земли, замени фон выше на: */
            /* background-image: url('ground.png'); */
            /* background-size: cover; */
            /* background-color: transparent; */
            
            transform-origin: 0 0; /* Важно для зума (если будем делать) */
        }

        /* Слой для зданий (чтобы z-index работал) */
        .building-img {
            position: absolute;
            pointer-events: none;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.7));
            transform: translate(-50%, -85%); /* Центровка по низу */
            transition: none;
        }

        /* Меню постройки */
        #build-menu {
            display: none; position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: linear-gradient(180deg, #16213e, #0a0f1e);
            padding: 15px;
            box-sizing: border-box; z-index: 2000;
            border-top: 2px solid #FFD700;
            text-align: center;
        }
        #build-menu h4 { margin: 0 0 10px 0; color: #FFD700; }
        .build-option {
            display: inline-block;
            width: 80px; height: 80px;
            margin: 5px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #FFD700;
            border-radius: 10px;
            cursor: pointer;
            padding: 5px;
            box-sizing: border-box;
            vertical-align: top;
        }
        .build-option img {
            width: 100%; height: 70%;
            object-fit: contain;
            pointer-events: none;
        }
        .build-option span {
            font-size: 10px;
            color: #fff;
            display: block;
            margin-top: 2px;
        }
        #build-menu button {
            padding: 10px 15px; font-size: 15px; margin: 4px;
        }
    </style>
</head>
<body>

    <!-- ЗАГРУЗКА -->
    <div id="splash-screen">
        <div class="game-title">Битва за трон</div>
        <div class="progress-container">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-text" id="progress-text">0%</div>
        </div>
    </div>

    <!-- БОЙ -->
    <div id="game-container">
        <h2>Бой начался!</h2>
        <div class="card">
            <h3>👹 Враг: Гоблин</h3>
            <div class="hp-bar"><div class="hp-fill" id="enemy-hp-bar"></div></div>
            <p>HP: <span id="enemy-hp-text">50</span> / 50</p>
        </div>
        <div class="log" id="log">Ты готов к бою...</div>
        <div class="card">
            <h3>🛡️ Твой Воин</h3>
            <div class="hp-bar"><div class="hp-fill" id="player-hp-bar" style="background-color: #4e9f3d;"></div></div>
            <p>HP: <span id="player-hp-text">100</span> / 100</p>
        </div>
        <button onclick="attack()">Атаковать!</button>
        <button onclick="openMap()">🗺️ На базу</button>
        <button onclick="location.reload()">Заново</button>
    </div>

    <!-- КАРТА -->
    <div id="map-screen">
        <div id="map-toolbar">
            <h3>🏰 Твоя база</h3>
            <button onclick="closeMap()">Закрыть</button>
        </div>
        <div id="map-viewport">
            <div id="map-world"></div>
        </div>
    </div>

    <!-- МЕНЮ ПОСТРОЙКИ -->
    <div id="build-menu">
        <h4>Выбери здание</h4>
        <div id="build-options"></div>
        <button onclick="closeBuildMenu()">Отмена</button>
    </div>

    <script>
        // --- TELEGRAM ---
        window.onload = () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready(); tg.expand();
                try { if (tg.requestFullscreen) tg.requestFullscreen(); } catch(e) {}
                if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
            }
            startLoading();
            initMap();
        };

        // --- ЗАГРУЗКА ---
        let progress = 0;
        const fill = document.getElementById('progress-fill');
        const text = document.getElementById('progress-text');
        const splash = document.getElementById('splash-screen');
        const game = document.getElementById('game-container');

        function startLoading() {
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 5) + 1;
                if (progress >= 100) {
                    progress = 100; clearInterval(interval);
                    setTimeout(() => {
                        splash.style.opacity = '0';
                        setTimeout(() => {
                            splash.style.display = 'none';
                            game.style.display = 'block';
                        }, 1000);
                    }, 500);
                }
                fill.style.width = progress + '%';
                text.innerText = progress + '%';
            }, 50);
        }

        // --- БОЙ ---
        let enemyHp = 50, playerHp = 100, isGameOver = false;
        const enemyHpBar = document.getElementById('enemy-hp-bar');
        const enemyHpText = document.getElementById('enemy-hp-text');
        const playerHpBar = document.getElementById('player-hp-bar');
        const playerHpText = document.getElementById('player-hp-text');
        const log = document.getElementById('log');

        function updateUI() {
            enemyHpBar.style.width = Math.max(0, (enemyHp/50)*100) + '%';
            enemyHpText.innerText = Math.max(0, enemyHp);
            playerHpBar.style.width = Math.max(0, (playerHp/100)*100) + '%';
            playerHpText.innerText = Math.max(0, playerHp);
        }
        function attack() {
            if (isGameOver) return;
            let playerDamage = Math.floor(Math.random()*6) + 10;
            enemyHp -= playerDamage;
            log.innerText = `Ты нанёс ${playerDamage} урона!`;
            updateUI();
            if (enemyHp <= 0) { log.innerText += " 👑 Враг повержен!"; isGameOver = true; return; }
            setTimeout(() => {
                if (isGameOver) return;
                let enemyDamage = Math.floor(Math.random()*5) + 5;
                playerHp -= enemyDamage;
                log.innerText += ` | Враг нанёс ${enemyDamage} урона!`;
                updateUI();
                if (playerHp <= 0) { log.innerText += " 💀 Ты проиграл..."; isGameOver = true; }
            }, 500);
        }

        // --- КАРТА ---
        const mapWorld = document.getElementById('map-world');
        const mapScreen = document.getElementById('map-screen');
        const mapViewport = document.getElementById('map-viewport');
        const buildMenu = document.getElementById('build-menu');
        const buildOptionsEl = document.getElementById('build-options');
        
        const MAP_WIDTH = 2000;
        const MAP_HEIGHT = 1500;

        const BUILDINGS = {
            castle:    { name: 'Замок',       img: 'castle.png',     size: 200 }, 
            barracks:  { name: 'Казарма',     img: 'barracks.png',   size: 120 }, 
            farm:      { name: 'Ферма',       img: 'farm.png',       size: 120 }, 
            quarry:    { name: 'Каменоломня', img: 'quarry.png',     size: 120 }, 
            lumbermill:{ name: 'Лесопилка',   img: 'lumbermill.png', size: 120 }  
        };

        const BUILDABLE = ['barracks', 'farm', 'quarry', 'lumbermill'];

        let buildingsOnMap = [];

        // Переменные для панорамирования (перетаскивания)
        let isDragging = false;
        let startX, startY;
        let translateX = 0, translateY = 0; // Текущий сдвиг карты
        let pendingTapX = null, pendingTapY = null;

        function initMap() {
            mapWorld.innerHTML = '';
            
            let saved = localStorage.getItem('baseBuildings');
            if (saved) {
                try { buildingsOnMap = JSON.parse(saved); } catch(e) { buildingsOnMap = []; }
            } else {
                // Ставим Замок в центр
                buildingsOnMap = [
                    { id: 1, key: 'castle', x: MAP_WIDTH/2, y: MAP_HEIGHT/2 }
                ];
                saveBuildings();
            }

            buildingsOnMap.forEach(b => renderBuilding(b));

            // Меню постройки
            buildOptionsEl.innerHTML = '';
            BUILDABLE.forEach(key => {
                const b = BUILDINGS[key];
                const opt = document.createElement('div');
                opt.className = 'build-option';
                opt.innerHTML = `<img src="${b.img}" alt="${b.name}"><span>${b.name}</span>`;
                opt.addEventListener('click', (e) => {
                    e.stopPropagation();
                    placeBuilding(key);
                });
                buildOptionsEl.appendChild(opt);
            });

            // Центрируем камеру на Замке при старте
            setTimeout(() => {
                const centerX = window.innerWidth / 2 - MAP_WIDTH / 2;
                const centerY = window.innerHeight / 2 - MAP_HEIGHT / 2;
                translateX = centerX;
                translateY = centerY;
                updateMapPosition();
            }, 100);

            // --- ОБРАБОТЧИКИ ПЕРЕТАСКИВАНИЯ (КАМЕРА) ---
            mapViewport.addEventListener('mousedown', startDrag);
            mapViewport.addEventListener('touchstart', startDrag, {passive: false});
            
            window.addEventListener('mousemove', drag);
            window.addEventListener('touchmove', drag, {passive: false});
            
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchend', endDrag);
        }

        function startDrag(e) {
            isDragging = true;
            if (e.touches) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }
            pendingTapX = null; // Сбрасываем возможный клик
        }

        function drag(e) {
            if (!isDragging) return;
            // Предотвращаем скролл страницы
            if (e.cancelable) e.preventDefault(); 

            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const dx = clientX - startX;
            const dy = clientY - startY;

            // Если сдвинули больше чем на 5 пикселей, это уже не клик, а перетаскивание
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                pendingTapX = null;
            }

            translateX += dx;
            translateY += dy;
            
            startX = clientX;
            startY = clientY;
            
            updateMapPosition();
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
        }

        function updateMapPosition() {
            mapWorld.style.transform = `translate(${translateX}px, ${translateY}px)`;
        }

        // Обработка клика/тапа (открытие меню постройки)
        mapViewport.addEventListener('click', (e) => {
            if (isDragging) return;
            // Если это был скролл, а не клик
            if (e.clientX && e.clientY) {
                // Пересчитываем координаты клика в координаты карты
                const rect = mapViewport.getBoundingClientRect();
                const clickX = e.clientX - rect.left - translateX;
                const clickY = e.clientY - rect.top - translateY;
                
                // Проверяем границы
                if (clickX >= 0 && clickX <= MAP_WIDTH && clickY >= 0 && clickY <= MAP_HEIGHT) {
                    window.pendingX = clickX;
                    window.pendingY = clickY;
                    buildMenu.style.display = 'block';
                }
            }
        });

        function renderBuilding(b) {
            const config = BUILDINGS[b.key];
            const img = document.createElement('img');
            img.src = config.img;
            img.className = 'building-img';
            img.style.width = config.size + 'px';
            img.style.height = config.size + 'px';
            
            // Позиция
            img.style.left = b.x + 'px';
            img.style.top = b.y + 'px';
            
            // Z-index (сортировка по глубине)
            img.style.zIndex = Math.floor(b.y);

            img.dataset.id = b.id;
            mapWorld.appendChild(img);
        }

        function placeBuilding(key) {
            if (window.pendingX === undefined || window.pendingX === null) return;

            const newBuilding = {
                id: Date.now(),
                key: key,
                x: window.pendingX,
                y: window.pendingY
            };

            buildingsOnMap.push(newBuilding);
            renderBuilding(newBuilding);
            saveBuildings();
            
            closeBuildMenu();
            window.pendingX = null;
            window.pendingY = null;
        }

        function closeBuildMenu() {
            buildMenu.style.display = 'none';
        }

        function saveBuildings() {
            try { localStorage.setItem('baseBuildings', JSON.stringify(buildingsOnMap)); } catch(e) {}
        }

        // --- ПЕРЕХОДЫ ---
        function openMap() {
            game.style.display = 'none';
            mapScreen.style.display = 'block';
            // Центрируем камеру при открытии
            if (buildingsOnMap.length > 0) {
                const castle = buildingsOnMap.find(b => b.key === 'castle');
                if (castle) {
                    translateX = window.innerWidth / 2 - castle.x;
                    translateY = window.innerHeight / 2 - castle.y;
                    updateMapPosition();
                }
            }
        }
        
        function closeMap() {
            mapScreen.style.display = 'none';
            game.style.display = 'block';
        }
    </script>
</body>
</html>
