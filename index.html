<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Битва за трон</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: white;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- ЗАГРУЗКА --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('bj.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 1s ease-out;
        }
        #splash-screen::before {
            content: ""; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: -1;
        }
        .game-title {
            font-family: 'Georgia', serif; font-size: 42px; font-weight: bold;
            color: #FFD700; text-align: center; text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #FF8C00, 0 0 20px #FF4500, 0 0 30px #FF4500;
            margin-bottom: 50px; animation: fadeInDown 2s ease-out;
        }
        .progress-container {
            width: 80%; max-width: 350px; height: 30px;
            background-color: rgba(255,255,255,0.2);
            border: 2px solid #FFD700; border-radius: 15px;
            position: relative; overflow: hidden;
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 12px; transition: width 0.1s linear;
        }
        .progress-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold; font-size: 16px;
            color: #fff; text-shadow: 1px 1px 3px #000;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- БОЙ --- */
        #game-container {
            display: none; padding: 20px; text-align: center;
            height: 100vh; box-sizing: border-box;
            background-color: #1a1a2e; overflow-y: auto;
        }
        .card {
            background-color: #16213e; border-radius: 15px;
            padding: 15px; margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .hp-bar { background-color: #444; height: 20px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .hp-fill { background-color: #e94560; height: 100%; width: 100%; transition: width 0.3s; }
        button {
            background-color: #0f3460; color: white; border: none;
            padding: 15px 30px; font-size: 18px; border-radius: 10px;
            margin: 5px; cursor: pointer;
        }
        button:active { background-color: #e94560; }
        .log { font-size: 14px; color: #aaa; height: 60px; margin-top: 10px; }

        /* --- КАРТА --- */
        #map-screen {
            display: none; position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #0d1b2a; z-index: 100; overflow: hidden;
        }
        #map-toolbar {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 10px; box-sizing: border-box;
            background: rgba(0,0,0,0.7);
            display: flex; justify-content: space-between;
            align-items: center; z-index: 10;
        }
        #map-toolbar h3 { margin: 0; color: #FFD700; font-size: 18px; }
        #map-toolbar button { padding: 8px 14px; font-size: 14px; margin: 0; }

        /* Игровое поле (зелёный фон, без клеток) */
        #map-scroll {
            position: absolute; top: 55px; left: 0;
            width: 100%; height: calc(100vh - 55px);
            overflow: auto; -webkit-overflow-scrolling: touch;
        }
        
        #map-grid {
            position: relative;
            width: 1000px;
            height: 800px;
            background-color: #2a5d34; /* Зелёный фон */
            /* Если хочешь текстуру земли, раскомментируй ниже: */
            /* background-image: url('ground.png'); */
            /* background-size: cover; */
        }

        /* Стили для зданий на карте */
        .building-img {
            position: absolute;
            pointer-events: none; /* чтобы клик шёл по карте */
            object-fit: contain;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.6));
            /* Центрируем картинку относительно точки клика */
            transform: translate(-50%, -80%); 
            transition: transform 0.1s;
        }

        /* Меню постройки */
        #build-menu {
            display: none; position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: linear-gradient(180deg, #16213e, #0a0f1e);
            padding: 15px;
            box-sizing: border-box; z-index: 200;
            border-top: 2px solid #FFD700;
            text-align: center;
        }
        #build-menu h4 { margin: 0 0 10px 0; color: #FFD700; }
        .build-option {
            display: inline-block;
            width: 80px; height: 80px;
            margin: 5px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #FFD700;
            border-radius: 10px;
            cursor: pointer;
            padding: 5px;
            box-sizing: border-box;
            vertical-align: top;
        }
        .build-option img {
            width: 100%; height: 70%;
            object-fit: contain;
            pointer-events: none;
        }
        .build-option span {
            font-size: 10px;
            color: #fff;
            display: block;
            margin-top: 2px;
        }
        #build-menu button {
            padding: 10px 15px; font-size: 15px; margin: 4px;
        }
    </style>
</head>
<body>

    <!-- ЗАГРУЗКА -->
    <div id="splash-screen">
        <div class="game-title">Битва за трон</div>
        <div class="progress-container">
            <div class="progress-fill" id="progress-fill"></div>
            <div class="progress-text" id="progress-text">0%</div>
        </div>
    </div>

    <!-- БОЙ -->
    <div id="game-container">
        <h2>Бой начался!</h2>
        <div class="card">
            <h3>👹 Враг: Гоблин</h3>
            <div class="hp-bar"><div class="hp-fill" id="enemy-hp-bar"></div></div>
            <p>HP: <span id="enemy-hp-text">50</span> / 50</p>
        </div>
        <div class="log" id="log">Ты готов к бою...</div>
        <div class="card">
            <h3>🛡️ Твой Воин</h3>
            <div class="hp-bar"><div class="hp-fill" id="player-hp-bar" style="background-color: #4e9f3d;"></div></div>
            <p>HP: <span id="player-hp-text">100</span> / 100</p>
        </div>
        <button onclick="attack()">Атаковать!</button>
        <button onclick="openMap()">🗺️ На базу</button>
        <button onclick="location.reload()">Заново</button>
    </div>

    <!-- КАРТА -->
    <div id="map-screen">
        <div id="map-toolbar">
            <h3>🏰 Твоя база</h3>
            <button onclick="closeMap()">Закрыть</button>
        </div>
        <div id="map-scroll">
            <div id="map-grid"></div>
        </div>
    </div>

    <!-- МЕНЮ ПОСТРОЙКИ -->
    <div id="build-menu">
        <h4>Выбери здание</h4>
        <div id="build-options"></div>
        <button onclick="closeBuildMenu()">Отмена</button>
    </div>

    <script>
        // --- TELEGRAM ---
        window.onload = () => {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready(); tg.expand();
                try { if (tg.requestFullscreen) tg.requestFullscreen(); } catch(e) {}
                if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
            }
            startLoading();
            initMap();
        };

        // --- ЗАГРУЗКА ---
        let progress = 0;
        const fill = document.getElementById('progress-fill');
        const text = document.getElementById('progress-text');
        const splash = document.getElementById('splash-screen');
        const game = document.getElementById('game-container');

        function startLoading() {
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 5) + 1;
                if (progress >= 100) {
                    progress = 100; clearInterval(interval);
                    setTimeout(() => {
                        splash.style.opacity = '0';
                        setTimeout(() => {
                            splash.style.display = 'none';
                            game.style.display = 'block';
                        }, 1000);
                    }, 500);
                }
                fill.style.width = progress + '%';
                text.innerText = progress + '%';
            }, 50);
        }

        // --- БОЙ ---
        let enemyHp = 50, playerHp = 100, isGameOver = false;
        const enemyHpBar = document.getElementById('enemy-hp-bar');
        const enemyHpText = document.getElementById('enemy-hp-text');
        const playerHpBar = document.getElementById('player-hp-bar');
        const playerHpText = document.getElementById('player-hp-text');
        const log = document.getElementById('log');

        function updateUI() {
            enemyHpBar.style.width = Math.max(0, (enemyHp/50)*100) + '%';
            enemyHpText.innerText = Math.max(0, enemyHp);
            playerHpBar.style.width = Math.max(0, (playerHp/100)*100) + '%';
            playerHpText.innerText = Math.max(0, playerHp);
        }
        function attack() {
            if (isGameOver) return;
            let playerDamage = Math.floor(Math.random()*6) + 10;
            enemyHp -= playerDamage;
            log.innerText = `Ты нанёс ${playerDamage} урона!`;
            updateUI();
            if (enemyHp <= 0) { log.innerText += " 👑 Враг повержен!"; isGameOver = true; return; }
            setTimeout(() => {
                if (isGameOver) return;
                let enemyDamage = Math.floor(Math.random()*5) + 5;
                playerHp -= enemyDamage;
                log.innerText += ` | Враг нанёс ${enemyDamage} урона!`;
                updateUI();
                if (playerHp <= 0) { log.innerText += " 💀 Ты проиграл..."; isGameOver = true; }
            }, 500);
        }

        // --- КАРТА ---
        const mapGrid = document.getElementById('map-grid');
        const mapScreen = document.getElementById('map-screen');
        const buildMenu = document.getElementById('build-menu');
        const buildOptionsEl = document.getElementById('build-options');
        
        // Размеры
        const MAP_WIDTH = 1000;
        const MAP_HEIGHT = 800;

        // Настройки зданий (размеры увеличены)
        const BUILDINGS = {
            castle:    { name: 'Замок',       img: 'castle.png',     size: 200 }, // х2
            barracks:  { name: 'Казарма',     img: 'barracks.png',   size: 120 }, // х1.5
            farm:      { name: 'Ферма',       img: 'farm.png',       size: 120 }, // х1.5
            quarry:    { name: 'Каменоломня', img: 'quarry.png',     size: 120 }, // х1.5
            lumbermill:{ name: 'Лесопилка',   img: 'lumbermill.png', size: 120 }  // х1.5
        };

        // Список зданий для меню (БЕЗ ЗАМКА)
        const BUILDABLE = ['barracks', 'farm', 'quarry', 'lumbermill'];

        // Массив всех зданий на карте
        // { id, key, x, y }
        let buildingsOnMap = [];

        function initMap() {
            mapGrid.innerHTML = '';
            
            // Проверяем сохранение
            let saved = localStorage.getItem('baseBuildings');
            if (saved) {
                try {
                    buildingsOnMap = JSON.parse(saved);
                } catch(e) { buildingsOnMap = []; }
            } else {
                // Если нет сохранения, ставим Замок в центр
                buildingsOnMap = [
                    { id: 1, key: 'castle', x: MAP_WIDTH/2, y: MAP_HEIGHT/2 }
                ];
                saveBuildings();
            }

            // Отрисовываем здания
            buildingsOnMap.forEach(b => renderBuilding(b));

            // Создаем меню постройки
            buildOptionsEl.innerHTML = '';
            BUILDABLE.forEach(key => {
                const b = BUILDINGS[key];
                const opt = document.createElement('div');
                opt.className = 'build-option';
                opt.innerHTML = `<img src="${b.img}" alt="${b.name}"><span>${b.name}</span>`;
                opt.addEventListener('click', (e) => {
                    e.stopPropagation();
                    placeBuilding(key);
                });
                buildOptionsEl.appendChild(opt);
            });

            // Обработчик клика по карте (по пустому месту)
            mapGrid.addEventListener('click', (e) => {
                // Если кликнули по зданию (у них pointer-events: none, так что клик всегда идет по карте)
                // Запоминаем координаты для постройки
                const rect = mapGrid.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                
                // Открываем меню
                window.pendingX = clickX;
                window.pendingY = clickY;
                buildMenu.style.display = 'block';
            });
        }

        // Отрисовка одного здания
        function renderBuilding(b) {
            const config = BUILDINGS[b.key];
            const img = document.createElement('img');
            img.src = config.img;
            img.className = 'building-img';
            img.style.width = config.size + 'px';
            img.style.height = config.size + 'px';
            // Позиция: центр картинки в точке x,y
            img.style.left = b.x + 'px';
            img.style.top = b.y + 'px';
            // Немного приподнимаем для эффекта изометрии
            img.style.transform = 'translate(-50%, -80%)'; 
            
            // Сортировка по глубине (y)
            img.style.zIndex = Math.floor(b.y);

            img.dataset.id = b.id;
            mapGrid.appendChild(img);
        }

        // Поставить здание
        function placeBuilding(key) {
            if (window.pendingX === undefined) return;

            // Проверка, чтобы не строили слишком близко к другим зданиям (опционально)
            // Здесь просто ставим в точку клика
            
            const newBuilding = {
                id: Date.now(),
                key: key,
                x: window.pendingX,
                y: window.pendingY
            };

            buildingsOnMap.push(newBuilding);
            renderBuilding(newBuilding);
            saveBuildings();
            
            // Закрываем меню и чистим координаты
            closeBuildMenu();
            window.pendingX = undefined;
            window.pendingY = undefined;
        }

        function closeBuildMenu() {
            buildMenu.style.display = 'none';
        }

        function saveBuildings() {
            try {
                localStorage.setItem('baseBuildings', JSON.stringify(buildingsOnMap));
            } catch(e) {}
        }

        // --- ПЕРЕХОДЫ ---
        function openMap() {
            game.style.display = 'none';
            mapScreen.style.display = 'block';
        }
        function closeMap() {
            mapScreen.style.display = 'none';
            game.style.display = 'block';
        }
    </script>
</body>
</html>
